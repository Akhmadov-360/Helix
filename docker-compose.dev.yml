# Локальная инфра для разработки Helix.
# Поднять: docker compose -f docker-compose.dev.yml up -d
name: helix-dev

services:
  postgres:
    # pgvector-образ уже сейчас: pgvector включим в M4 (RAG) без смены образа.
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: helix
      POSTGRES_PASSWORD: helix
      POSTGRES_DB: helix
    ports:
      # 5433 на хосте → 5432 в контейнере: избегаем конфликта с системным PG.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helix -d helix"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Тестовая БД: отдельный инстанс, чтобы прогон тестов (TRUNCATE в beforeEach)
  # физически не мог задеть данные разработки. Без persistence — эфемерна by design:
  # каждый up даёт чистую БД, состояние между прогонами не накапливается.
  helix-test-db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: helix
      POSTGRES_PASSWORD: helix
      POSTGRES_DB: helix_test
    ports:
      - "5434:5432"
    tmpfs:
      # Данные в RAM: быстрее (тесты часто пишут) и гарантированно не переживают контейнер.
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helix -d helix_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # SMTP-catcher для dev (PRD §12.4) — письма из notifications.md уходят сюда, не наружу.
  # Веб-интерфейс на 8025 читает их без реальной отправки.
  mailhog:
    image: mailhog/mailhog
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: helix
      MINIO_ROOT_PASSWORD: helixsecret
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # web console
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: ждёт MinIO и создаёт бакеты helix-uploads (dev) и helix-test (тесты, docs/specs/
  # files.md §14 — тот же MinIO-контейнер, отдельный неймспейс, не отдельный сервис). Выходит по завершении.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 helix helixsecret &&
      mc mb --ignore-existing local/helix-uploads &&
      mc mb --ignore-existing local/helix-test &&
      echo 'buckets helix-uploads, helix-test ready';
      "

volumes:
  pgdata:
  redisdata:
  miniodata:
