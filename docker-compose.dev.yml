# Локальная инфра для разработки Helix.
# Поднять: docker compose -f docker-compose.dev.yml up -d
name: helix-dev

services:
  postgres:
    # pgvector-образ; extension включена миграцией M4 (ai-chat.md §1.1, CLAUDE.md manual point #8).
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: helix
      POSTGRES_PASSWORD: helix
      POSTGRES_DB: helix
    ports:
      # 5433 на хосте → 5432 в контейнере: избегаем конфликта с системным PG.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helix -d helix"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Тестовая БД: отдельный инстанс, чтобы прогон тестов (TRUNCATE в beforeEach)
  # физически не мог задеть данные разработки. Без persistence — эфемерна by design:
  # каждый up даёт чистую БД, состояние между прогонами не накапливается.
  helix-test-db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: helix
      POSTGRES_PASSWORD: helix
      POSTGRES_DB: helix_test
    ports:
      - "5434:5432"
    tmpfs:
      # Данные в RAM: быстрее (тесты часто пишут) и гарантированно не переживают контейнер.
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helix -d helix_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # SMTP-catcher для dev (PRD §12.4) — письма из notifications.md уходят сюда, не наружу.
  # Веб-интерфейс на 8025 читает их без реальной отправки.
  mailhog:
    image: mailhog/mailhog
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI

  # S3-совместимое хранилище. MinIO убрал публичные образы (Docker Hub, Quay), поэтому RustFS:
  # те же порты и тот же S3 API, клиент (@aws-sdk/client-s3) не меняется. Версия зафиксирована.
  s3:
    image: rustfs/rustfs:1.0.0
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: helix
      RUSTFS_SECRET_KEY: helixsecret
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # web console
    volumes:
      - s3data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: ждёт S3 и создаёт бакеты helix-uploads (dev) и helix-test (тесты, docs/specs/
  # files.md §14 — тот же контейнер, отдельный неймспейс, не отдельный сервис). Идемпотентен.
  s3-init:
    image: amazon/aws-cli:2.37.7
    depends_on:
      s3:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: helix
      AWS_SECRET_ACCESS_KEY: helixsecret
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: >
      /bin/sh -c "
      for bucket in helix-uploads helix-test; do
      aws --endpoint-url http://s3:9000 s3api head-bucket --bucket $$bucket 2>/dev/null ||
      aws --endpoint-url http://s3:9000 s3 mb s3://$$bucket;
      done &&
      echo 'buckets helix-uploads, helix-test ready'
      "

volumes:
  pgdata:
  redisdata:
  s3data:
