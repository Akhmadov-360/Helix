# Render Blueprint — деплой apps/api (NestJS) как web-сервиса.
# Postgres (Supabase), Redis (Upstash), S3-совместимое хранилище, email — все внешние,
# здесь не заводим.
#
# Как применить:
#   1. Render Dashboard → New → Blueprint → выбрать этот репозиторий (ветка main).
#   2. Render найдёт этот файл и создаст сервис helix-api.
#   3. Значения с "sync: false" Render НЕ подставит сам — впишешь их вручную в
#      Dashboard → helix-api → Environment (это секреты, поэтому их нет в этом файле).
#      Бери значения из текущего Railway-проекта 1-в-1 (все переменные ниже совпадают
#      по именам с тем, что было на Railway) — кроме пары нюансов (см. ниже).
#
# Нюансы переноса с Railway (см. packages/config/src/env.schema.ts — источник истины по env):
#   - PORT не задаём: Render сам инжектит переменную PORT, apps/api/src/main.ts уже её читает.
#   - JWT_SECRET — ОБЯЗАТЕЛЬНО то же значение, что было на Railway, иначе все текущие
#     refresh-сессии в Supabase станут невалидны сразу после переезда.
#   - S3_ACCESS_KEY/S3_SECRET_KEY — берём как обычные explicit-креды (Render, как и Railway,
#     не AWS-инфра, IAM role здесь не резолвится).
#   - APP_URL/WEB_ORIGIN — публичный URL веб-приложения; меняем только если фронт тоже переезжает.

services:
  - type: web
    name: helix-api
    runtime: node
    plan: free
    region: frankfurt # ближайший к пользователям регион; поменяй при необходимости
    branch: main
    rootDir: .
    # corepack activate pnpm — на Render pnpm не предустановлен. turbo build собирает
    # весь граф зависимостей (config → db → api-schemas → ai → api) в правильном порядке,
    # включая `prisma generate` (входит в @helix/db build). migrate deploy — накатывает
    # только уже существующие миграции (без создания новых), безопасно на каждый деплой.
    buildCommand: >-
      corepack enable &&
      corepack prepare pnpm@10.33.0 --activate &&
      pnpm install --frozen-lockfile &&
      pnpm build &&
      pnpm --filter @helix/db exec prisma migrate deploy
    startCommand: pnpm --filter @helix/api start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production

      # ── Core ──────────────────────────────────────────────────────────────
      - key: DATABASE_URL
        sync: false # Supabase connection string — то же значение, что на Railway
      - key: REDIS_URL
        sync: false # Upstash, rediss:// (TLS) — НЕ redis://, см. feedback-paas-networking

      # ── Auth ──────────────────────────────────────────────────────────────
      - key: JWT_SECRET
        sync: false # ТО ЖЕ значение, что на Railway — иначе все refresh-сессии инвалидируются
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: REFRESH_TTL_DAYS
        value: "30"

      # ── CORS / deep links ─────────────────────────────────────────────────
      - key: WEB_ORIGIN
        sync: false # точный origin фронта (без wildcard — credentials: include)
      - key: APP_URL
        sync: false # публичный URL веб-приложения, для ссылок в письмах

      # ── Email — значение MAIL_PROVIDER берём с Railway как есть (resend ИЛИ smtp,
      # ── не угадываем): если там реально smtp с внешним хостом (не localhost/MailHog),
      # ── SMTP_HOST/PORT/USER/PASS ниже обязательны, иначе можно оставить пустыми.
      - key: MAIL_PROVIDER
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false

      # ── Files / S3 ────────────────────────────────────────────────────────
      # S3_ENDPOINT задан на Railway → прод НЕ на голом AWS S3, а на S3-совместимом
      # сервисе с явным endpoint'ом (R2/Backblaze/др.) — переносим как есть, не пропускаем.
      - key: S3_ENDPOINT
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false

      # ── AI / RAG ──────────────────────────────────────────────────────────
      - key: GOOGLE_AI_API_KEY
        sync: false
